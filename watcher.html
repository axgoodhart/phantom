<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantom & Replay System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        color: #ffffff;
        overflow: hidden;
        user-select: none;
      }

      #grid-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.3;
      }

      #grid-overlay.visible {
        opacity: 0.6;
      }

      .grid-line {
        position: absolute;
        background: #00ff88;
        box-shadow: 0 0 2px #00ff88;
      }

      .grid-line.horizontal {
        width: 100%;
        height: 1px;
      }

      .grid-line.vertical {
        height: 100%;
        width: 1px;
      }

      #control-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.9);
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #00ff88;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        z-index: 10000;
        min-width: 280px;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group h3 {
        color: #00ff88;
        margin-bottom: 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .button-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        color: #ffffff;
        border: 1px solid #00ff88;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
      }

      button:hover {
        background: linear-gradient(145deg, #00ff88, #00cc6a);
        color: #000000;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      }

      button:active {
        transform: translateY(1px);
      }

      button.recording {
        background: linear-gradient(145deg, #ff4444, #cc0000);
        animation: pulse 1.5s infinite;
      }

      button.replaying {
        background: linear-gradient(145deg, #4444ff, #0000cc);
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .status {
        background: rgba(0, 255, 136, 0.1);
        padding: 10px;
        border-radius: 5px;
        border-left: 3px solid #00ff88;
        font-size: 12px;
        font-family: 'Courier New', monospace;
      }

      .action-list {
        max-height: 150px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
        border-radius: 5px;
        padding: 10px;
      }

      .action-item {
        font-size: 11px;
        font-family: 'Courier New', monospace;
        color: #cccccc;
        margin: 2px 0;
        padding: 2px 5px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      .mouse-indicator {
        position: fixed;
        width: 12px;
        height: 12px;
        background: #ff0066;
        border: 2px solid #ffffff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 10001;
        box-shadow: 0 0 10px rgba(255, 0, 102, 0.7);
        transition: transform 0.1s ease;
      }

      .mouse-indicator.clicking {
        transform: scale(1.5);
        background: #00ff88;
      }

      #grid-size-control {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #grid-size-slider {
        flex: 1;
        accent-color: #00ff88;
      }

      .toggle-switch {
        position: relative;
        width: 50px;
        height: 24px;
        background: #333;
        border-radius: 12px;
        border: 1px solid #00ff88;
        cursor: pointer;
        transition: background 0.3s;
      }

      .toggle-switch.active {
        background: #00ff88;
      }

      .toggle-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.3s;
      }

      .toggle-switch.active .toggle-knob {
        transform: translateX(24px);
      }
    </style>
  </head>
  <body>
    <div id="grid-overlay"></div>
    <div class="mouse-indicator" id="mouse-indicator"></div>

    <div id="control-panel">
      <div class="control-group">
        <h3>Recording Controls</h3>
        <div class="button-group">
          <button id="start-recording">Start Recording</button>
          <button id="stop-recording" disabled>Stop Recording</button>
          <button id="replay-actions" disabled>Replay Actions</button>
          <button id="clear-actions">Clear Actions</button>
        </div>
      </div>

      <div class="control-group">
        <h3>Grid Controls</h3>
        <div class="button-group">
          <div class="toggle-switch" id="grid-toggle">
            <div class="toggle-knob"></div>
          </div>
          <span style="font-size: 12px">Show Grid</span>
        </div>
        <div id="grid-size-control">
          <span style="font-size: 11px">Size:</span>
          <input
            type="range"
            id="grid-size-slider"
            min="20"
            max="100"
            value="50"
          />
          <span id="grid-size-value">50px</span>
        </div>
      </div>

      <div class="control-group">
        <h3>Status</h3>
        <div class="status" id="status">Ready to record</div>
      </div>

      <div class="control-group">
        <h3>Actions (<span id="action-count">0</span>)</h3>
        <div class="action-list" id="action-list"></div>
      </div>
    </div>

    <script>
      class ActionRecorder {
        constructor() {
          this.actions = []
          this.isRecording = false
          this.isReplaying = false
          this.startTime = 0
          this.gridVisible = false
          this.gridSize = 50

          this.initializeElements()
          this.setupEventListeners()
          this.createGrid()
          this.updateMouseIndicator()
        }

        initializeElements() {
          this.startBtn = document.getElementById('start-recording')
          this.stopBtn = document.getElementById('stop-recording')
          this.replayBtn = document.getElementById('replay-actions')
          this.clearBtn = document.getElementById('clear-actions')
          this.gridToggle = document.getElementById('grid-toggle')
          this.gridSizeSlider = document.getElementById('grid-size-slider')
          this.gridSizeValue = document.getElementById('grid-size-value')
          this.status = document.getElementById('status')
          this.actionList = document.getElementById('action-list')
          this.actionCount = document.getElementById('action-count')
          this.gridOverlay = document.getElementById('grid-overlay')
          this.mouseIndicator = document.getElementById('mouse-indicator')
        }

        setupEventListeners() {
          // Control buttons
          this.startBtn.addEventListener('click', () => this.startRecording())
          this.stopBtn.addEventListener('click', () => this.stopRecording())
          this.replayBtn.addEventListener('click', () => this.replayActions())
          this.clearBtn.addEventListener('click', () => this.clearActions())

          // Grid controls
          this.gridToggle.addEventListener('click', () => this.toggleGrid())
          this.gridSizeSlider.addEventListener('input', e =>
            this.updateGridSize(e.target.value)
          )

          // Global event listeners for recording
          document.addEventListener('mousemove', e => this.handleMouseMove(e))
          document.addEventListener('mousedown', e => this.handleMouseDown(e))
          document.addEventListener('mouseup', e => this.handleMouseUp(e))
          document.addEventListener('keydown', e => this.handleKeyDown(e))
          document.addEventListener('keyup', e => this.handleKeyUp(e))
          document.addEventListener('wheel', e => this.handleWheel(e))

          // Prevent context menu during recording
          document.addEventListener('contextmenu', e => {
            if (this.isRecording) e.preventDefault()
          })
        }

        createGrid() {
          this.gridOverlay.innerHTML = ''
          const width = window.innerWidth
          const height = window.innerHeight

          // Vertical lines
          for (let x = 0; x <= width; x += this.gridSize) {
            const line = document.createElement('div')
            line.className = 'grid-line vertical'
            line.style.left = `${x}px`
            this.gridOverlay.appendChild(line)
          }

          // Horizontal lines
          for (let y = 0; y <= height; y += this.gridSize) {
            const line = document.createElement('div')
            line.className = 'grid-line horizontal'
            line.style.top = `${y}px`
            this.gridOverlay.appendChild(line)
          }
        }

        toggleGrid() {
          this.gridVisible = !this.gridVisible
          this.gridToggle.classList.toggle('active', this.gridVisible)
          this.gridOverlay.classList.toggle('visible', this.gridVisible)
        }

        updateGridSize(size) {
          this.gridSize = parseInt(size)
          this.gridSizeValue.textContent = `${this.gridSize}px`
          this.createGrid()
        }

        updateMouseIndicator() {
          document.addEventListener('mousemove', e => {
            this.mouseIndicator.style.left = `${e.clientX - 6}px`
            this.mouseIndicator.style.top = `${e.clientY - 6}px`
          })
        }

        startRecording() {
          this.actions = []
          this.isRecording = true
          this.startTime = Date.now()

          this.startBtn.disabled = true
          this.startBtn.classList.add('recording')
          this.stopBtn.disabled = false
          this.replayBtn.disabled = true

          this.updateStatus(
            'Recording... Move mouse and type to capture actions'
          )
          this.updateActionList()
        }

        stopRecording() {
          this.isRecording = false

          this.startBtn.disabled = false
          this.startBtn.classList.remove('recording')
          this.stopBtn.disabled = true
          this.replayBtn.disabled = this.actions.length === 0

          this.updateStatus(
            `Recording stopped. Captured ${this.actions.length} actions`
          )
        }

        recordAction(type, data) {
          if (!this.isRecording) return

          const action = {
            type,
            data,
            timestamp: Date.now() - this.startTime,
            gridX: Math.floor(data.x / this.gridSize) * this.gridSize,
            gridY: Math.floor(data.y / this.gridSize) * this.gridSize
          }

          this.actions.push(action)
          this.updateActionList()
        }

        async replayActions() {
          if (this.actions.length === 0 || this.isReplaying) return

          this.isReplaying = true
          this.replayBtn.classList.add('replaying')
          this.replayBtn.disabled = true

          this.updateStatus('Replaying actions...')

          let lastTimestamp = 0

          for (const action of this.actions) {
            const delay = action.timestamp - lastTimestamp
            if (delay > 0) {
              await new Promise(resolve =>
                setTimeout(resolve, Math.min(delay, 2000))
              ) // Cap delay at 2 seconds
            }

            this.executeAction(action)
            lastTimestamp = action.timestamp
          }

          this.isReplaying = false
          this.replayBtn.classList.remove('replaying')
          this.replayBtn.disabled = false
          this.updateStatus('Replay completed')
        }

        executeAction(action) {
          const indicator = this.mouseIndicator

          switch (action.type) {
            case 'mousemove':
              indicator.style.left = `${action.data.x - 6}px`
              indicator.style.top = `${action.data.y - 6}px`
              break

            case 'mousedown':
              indicator.classList.add('clicking')
              indicator.style.left = `${action.data.x - 6}px`
              indicator.style.top = `${action.data.y - 6}px`
              // Simulate click at position (visual feedback only)
              this.showClickEffect(action.data.x, action.data.y)
              break

            case 'mouseup':
              indicator.classList.remove('clicking')
              break

            case 'keydown':
              this.showKeyPress(action.data.key)
              break
          }
        }

        showClickEffect(x, y) {
          const effect = document.createElement('div')
          effect.style.cssText = `
                    position: fixed;
                    left: ${x - 10}px;
                    top: ${y - 10}px;
                    width: 20px;
                    height: 20px;
                    border: 2px solid #00ff88;
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 10002;
                    animation: clickRipple 0.6s ease-out forwards;
                `

          const style = document.createElement('style')
          style.textContent = `
                    @keyframes clickRipple {
                        0% { transform: scale(1); opacity: 1; }
                        100% { transform: scale(3); opacity: 0; }
                    }
                `
          document.head.appendChild(style)
          document.body.appendChild(effect)

          setTimeout(() => {
            document.body.removeChild(effect)
            document.head.removeChild(style)
          }, 600)
        }

        showKeyPress(key) {
          const keyDisplay = document.createElement('div')
          keyDisplay.textContent = key
          keyDisplay.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 255, 136, 0.9);
                    color: #000;
                    padding: 10px 20px;
                    border-radius: 5px;
                    font-family: monospace;
                    font-size: 18px;
                    font-weight: bold;
                    z-index: 10002;
                    animation: keyPulse 0.5s ease-out forwards;
                `

          const style = document.createElement('style')
          style.textContent = `
                    @keyframes keyPulse {
                        0% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
                        100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
                    }
                `
          document.head.appendChild(style)
          document.body.appendChild(keyDisplay)

          setTimeout(() => {
            document.body.removeChild(keyDisplay)
            document.head.removeChild(style)
          }, 500)
        }

        clearActions() {
          this.actions = []
          this.updateActionList()
          this.replayBtn.disabled = true
          this.updateStatus('Actions cleared')
        }

        // Event handlers
        handleMouseMove(e) {
          this.recordAction('mousemove', { x: e.clientX, y: e.clientY })
        }

        handleMouseDown(e) {
          if (e.target.closest('#control-panel')) return // Don't record control panel clicks
          this.recordAction('mousedown', {
            x: e.clientX,
            y: e.clientY,
            button: e.button
          })
        }

        handleMouseUp(e) {
          if (e.target.closest('#control-panel')) return
          this.recordAction('mouseup', {
            x: e.clientX,
            y: e.clientY,
            button: e.button
          })
        }

        handleKeyDown(e) {
          // Don't record control keys or when typing in control panel
          if (
            e.target.closest('#control-panel') ||
            e.ctrlKey ||
            e.altKey ||
            e.metaKey
          )
            return

          this.recordAction('keydown', {
            key: e.key,
            code: e.code,
            shiftKey: e.shiftKey
          })
        }

        handleKeyUp(e) {
          if (
            e.target.closest('#control-panel') ||
            e.ctrlKey ||
            e.altKey ||
            e.metaKey
          )
            return

          this.recordAction('keyup', {
            key: e.key,
            code: e.code
          })
        }

        handleWheel(e) {
          this.recordAction('wheel', {
            x: e.clientX,
            y: e.clientY,
            deltaX: e.deltaX,
            deltaY: e.deltaY
          })
        }

        updateStatus(message) {
          this.status.textContent = message
        }

        updateActionList() {
          const list = this.actionList
          const count = this.actionCount

          count.textContent = this.actions.length

          // Show last 20 actions
          const recentActions = this.actions.slice(-20)
          list.innerHTML = recentActions
            .map((action, index) => {
              const timeStr = `${action.timestamp}ms`
              const actionStr = this.formatAction(action)
              return `<div class="action-item">${timeStr}: ${actionStr}</div>`
            })
            .join('')

          list.scrollTop = list.scrollHeight
        }

        formatAction(action) {
          switch (action.type) {
            case 'mousemove':
              return `Move to (${action.data.x}, ${action.data.y})`
            case 'mousedown':
              return `Click down at (${action.data.x}, ${action.data.y}) btn:${action.data.button}`
            case 'mouseup':
              return `Click up at (${action.data.x}, ${action.data.y}) btn:${action.data.button}`
            case 'keydown':
              return `Key down: ${action.data.key}`
            case 'keyup':
              return `Key up: ${action.data.key}`
            case 'wheel':
              return `Scroll at (${action.data.x}, ${action.data.y}) Δ(${action.data.deltaX}, ${action.data.deltaY})`
            default:
              return `${action.type}: ${JSON.stringify(action.data)}`
          }
        }
      }

      // Initialize the application
      const recorder = new ActionRecorder()

      // Handle window resize
      window.addEventListener('resize', () => {
        recorder.createGrid()
      })

      // Keyboard shortcuts
      document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'r' && !e.target.closest('#control-panel')) {
          e.preventDefault()
          if (!recorder.isRecording) {
            recorder.startRecording()
          } else {
            recorder.stopRecording()
          }
        }

        if (e.ctrlKey && e.key === 'p' && !e.target.closest('#control-panel')) {
          e.preventDefault()
          if (!recorder.isReplaying) {
            recorder.replayActions()
          }
        }
      })

      console.log(
        'Phantom initialized. Use Ctrl+R to start/stop recording, Ctrl+P to replay.'
      )
    </script>
  </body>
</html>
